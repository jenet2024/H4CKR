version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: h4ckr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-h4ckr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-h4ckrpass}
      POSTGRES_DB: h4ckr_game
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-h4ckr} -d h4ckr_game"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: h4ckr_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-h4ckr}:${DB_PASSWORD:-h4ckrpass}@postgres:5432/h4ckr_game
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_256_BITS}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ASSETS_DIR: /app/assets
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-YOUR_GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-YOUR_TWITTER_CLIENT_ID}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-YOUR_TWITTER_CLIENT_SECRET}
      TWITTER_REDIRECT_URI: ${TWITTER_REDIRECT_URI:-http://localhost:8000/auth/twitter/callback}
    volumes:
      - assets_data:/app/assets
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: h4ckr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  pgadmin:
    image: dpage/pgadmin4
    container_name: h4ckr_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  assets_data:
